name: P-cut native builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate native runners
        run: python3 scripts/bootstrap.py
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze source
        run: flutter analyze
      - name: Test native configuration
        run: python -m unittest discover -s test -p "test_*.py"
      - run: dart test/project_offline.dart
      - run: dart test/advanced_offline.dart
      - run: flutter test
      - name: Test actual FFmpeg export plan
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          dart test/ffmpeg_integration.dart
          dart test/advanced_render.dart
          dart test/audio_render.dart
      - name: Prepare Android NDK
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          if [ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
      - name: Build Android beta
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: P-cut-Android-Beta
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: python scripts/bootstrap.py
      - run: flutter pub get
      - run: flutter analyze
      - name: Test native configuration
        run: python -m unittest discover -s test -p "test_*.py"
      - run: dart test/project_offline.dart
      - run: dart test/advanced_offline.dart
      - run: flutter test
      - name: Build Windows
        run: flutter build windows --release
      - name: Install installer tool
        run: choco install innosetup --yes --no-progress
      - name: Create installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" scripts/windows-installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: P-cut-Windows
          path: |
            dist/P-cut-Setup.exe
            build/windows/x64/runner/Release/
          if-no-files-found: error
